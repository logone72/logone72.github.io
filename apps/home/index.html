  <head>

    <meta property="og:title" content="Roegan Kim" />
    <meta
      property="og:description"
      content="I build clear, fast frontend interfaces that are easy to maintain."
    />
    <meta property="og:url" content="https://logone72.github.io/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ko_KR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Roegan Kim" />

      name="twitter:description"
      content="I build clear, fast frontend interfaces that are easy to maintain."

    <link rel="canonical" href="https://logone72.github.io/" />
    <link rel="alternate" hreflang="en" href="https://logone72.github.io/" />
    <link rel="alternate" hreflang="ko" href="https://logone72.github.io/ko/" />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://logone72.github.io/"
    />
    <link rel="icon" href="/favicon.ico" />
    <title>Roegan Kim</title>
    <script>
      (() => {
        const root = document.documentElement;
        const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
        let theme = prefersDark ? 'dark' : 'light';

        try {
          const storedTheme = localStorage.getItem('home-theme');
          if (storedTheme === 'dark' || storedTheme === 'light') {
            theme = storedTheme;
          }
          if (sessionStorage.getItem('home-intro-seen')) {
            root.dataset.intro = 'seen';
          }
        } catch {}

        if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
          root.dataset.intro = 'seen';
        }
        root.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
